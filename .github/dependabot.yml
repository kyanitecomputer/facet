version: 2
updates:
  # Keep pinned action SHAs/tags current (security-critical).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # npm/pnpm dependency bumps. Our exact pins + pnpm minimumReleaseAge still
  # apply, so a too-new bump fails the frozen install in CI and is reviewed.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
